[package]
name = "matchbox-host"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = "0.14"
kvm-ioctls = "0.25"

[dependencies]
crossbeam-deque = "0.8"
crossbeam-utils = "0.8"
memfd = "0.6"
nix = "0.31"
reqwest = { version = "0.13", features = ["blocking", "rustls"] }
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
libc = "0.2"